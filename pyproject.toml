[project]
name = "slimproof"
version = "0.0.1"
description = "Audit and slim MCP tool definitions, with proof they still work. Under active development."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rounak Sonavane" }]
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2.3.0", "typer>=0.27.3"]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Repository = "https://github.com/Rounak7721/slimproof"

[project.scripts]
slimproof = "slimproof:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
