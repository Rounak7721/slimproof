[project]
name = "slimproof"
version = "0.1.2"
description = "Audit and slim MCP tool definitions, with proof they still work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rounak Sonavane" }]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.15.1",
    "httpx2>=2.14.0",
    "mcp[cli]>=2.3.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]
keywords = ["mcp", "claude", "claude-code", "tokens", "context-window", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/Rounak7721/slimproof"
Issues = "https://github.com/Rounak7721/slimproof/issues"
Changelog = "https://github.com/Rounak7721/slimproof/blob/main/CHANGELOG.md"

[project.scripts]
slimproof = "slimproof.cli:app"

[project.optional-dependencies]
claude = [
    "anthropic>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
eval = [
    "anthropic>=2.12.0",
    "jsonschema>=4.26.0",
]
